<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>GPT Switch</title>
  <script>
    try {
      const savedTheme = window.localStorage.getItem("ai-switch-theme");
      const systemDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme =
        savedTheme === "dark" || savedTheme === "light"
          ? savedTheme
          : systemDark
            ? "dark"
            : "light";
      document.documentElement.dataset.theme = theme;
    } catch (_error) {}
  </script>
  <style>
    html {
      --boot-bg: #ffffff;
      background: var(--boot-bg);
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --boot-bg: #000000;
      color-scheme: dark;
    }

    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--boot-bg);
    }

    .boot-screen {
      display: grid;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2147483647;
      place-items: center;
      background: var(--boot-bg);
    }

    .boot-icon {
      width: 56px;
      height: 56px;
      animation: boot-pulse 1200ms ease-in-out infinite;
      filter: drop-shadow(0 10px 22px rgba(227, 42, 75, 0.18));
    }

    @keyframes boot-pulse {
      0%,
      100% {
        opacity: 0.82;
        transform: scale(0.96);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --boot-bg: #000000;
        color-scheme: dark;
      }

      .boot-screen {
        background: var(--boot-bg);
      }
    }
  </style>
  <script type="module">
    const analyticsWebsiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
    const analyticsScriptUrl = import.meta.env.VITE_ANALYTICS_SCRIPT_URL;

    window.gptSwitchAnalyticsBeforeSend = function (_type, payload) {
      return {
        ...payload,
        hostname: "desktop.gptswitch.local",
        url: "/desktop",
        title: "GPT Switch Desktop",
        referrer: "",
      };
    };

    if (analyticsWebsiteId && analyticsScriptUrl) {
      const script = document.createElement("script");
      script.defer = true;
      script.src = analyticsScriptUrl;
      script.setAttribute("data-website-id", analyticsWebsiteId);
      script.setAttribute("data-auto-pageview", "false");
      script.setAttribute("data-before-send", "gptSwitchAnalyticsBeforeSend");
      document.head.appendChild(script);
    }
  </script>
</head>

<body>
  <div id="boot-screen" class="boot-screen" aria-label="GPT Switch">
    <img class="boot-icon" src="./favicon.svg" alt="" />
  </div>
  <div id="root"></div>
  <script type="module" src="/src/renderer/main.tsx"></script>
</body>

</html>
